name: mox_digital_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  flutter_web_plugins:
    sdk: flutter

  # ============================================================
  # الحزم الأساسية والروابط
  # ============================================================
  cupertino_icons: ^1.0.8
  app_links: ^7.2.1
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.0

  # ============================================================
  # التخزين والإعدادات
  # ============================================================
  shared_preferences: ^2.3.2

  # ============================================================
  # الاتصال بالإنترنت
  # ============================================================
  http: ^1.2.0

  # ============================================================
  # عرض صفحات الويب
  # ============================================================
  webview_flutter: ^4.7.0

  # ============================================================
  # الملفات
  # ============================================================
  file_picker: ^12.1.0

  # ============================================================
  # قاعدة البيانات المحلية
  # ============================================================
  sqflite: ^2.3.3
  path: ^1.9.0

  # ============================================================
  # التشفير والتوقيع الرقمي الحقيقي
  # ============================================================
  cryptography: ^2.7.0

  # ============================================================
  # إنشاء ملفات PDF
  # ============================================================
  pdf: ^3.11.3

  # ============================================================
  # الوصول إلى مجلدات الجهاز
  # ============================================================
  path_provider: ^2.1.5

  # ============================================================
  # فتح المستند بعد إنشائه
  # ============================================================
  open_filex: ^4.7.0
  printing: ^5.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  # ============================================================
  # الأصول الرسمية
  # ============================================================
  assets:
    - assets/logo.png
    - assets/mox_app_icon.ico

  # ============================================================
  # خط Cairo
  # ============================================================
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700

# ==============================================================
# إعدادات أيقونة التطبيق
# ==============================================================
flutter_launcher_icons:
  image_path: "assets/mox_app_icon.ico"
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/mox_app_icon.ico"